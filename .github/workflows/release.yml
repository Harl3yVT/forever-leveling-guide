name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python tools/validate.py
      - name: Zip addons
        run: |
          VER="${GITHUB_REF_NAME#v}"
          zip -r "forever-leveling-guide-${VER}.zip" Guidelime_HarleyMage Guidelime_Bethink WarlockKit
          echo "VER=${VER}" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "forever-leveling-guide-${VER}.zip" \
            --title "Guide ${VER}" --notes "See CHANGELOG.md. Unzip the three folders into Interface\\AddOns, replacing the old ones." \
            || gh release upload "$GITHUB_REF_NAME" "forever-leveling-guide-${VER}.zip" --clobber
